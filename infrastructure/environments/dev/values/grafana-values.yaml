# Grafana configuration for observability dashboard
# Integrates Prometheus, Loki, and Jaeger datasources

# Image configuration - Grafana 12.x
image:
  repository: grafana/grafana
  tag: "12.0.2"

# Admin credentials
admin:
  existingSecret: ""
  userKey: admin-user
  passwordKey: admin-password

# Service configuration
service:
  type: ClusterIP
  port: 80

# Persistence
persistence:
  enabled: true
  storageClassName: gp3
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Datasources configuration
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Prometheus datasource for metrics
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server:80
        access: proxy
        isDefault: true
        editable: true
        
      # Loki datasource for logs
      - name: Loki
        type: loki
        url: http://loki-gateway:80
        access: proxy
        editable: true
        jsonData:
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
        
      # Jaeger datasource for traces
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger-query:16686
        access: proxy
        editable: true

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'airflow-dashboards'
        orgId: 1
        folder: 'Airflow'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/airflow
      - name: 'infrastructure-dashboards'
        orgId: 1
        folder: 'Infrastructure'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure

# Pre-configured dashboards
dashboards:
  airflow:
    # Airflow overview dashboard
    airflow-overview:
      gnetId: 12866
      revision: 1
      datasource: Prometheus
    
    # Airflow tasks dashboard
    airflow-tasks:
      gnetId: 13090
      revision: 1
      datasource: Prometheus
      
  infrastructure:
    # Kubernetes cluster dashboard
    k8s-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus
    
    # Node exporter dashboard
    node-exporter:
      gnetId: 1860
      revision: 29
      datasource: Prometheus

# Grafana configuration
grafana.ini:
  server:
    domain: localhost
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    serve_from_sub_path: true
  
  auth.anonymous:
    enabled: true
    org_role: Viewer
  
  feature_toggles:
    enable: correlations
  
  explore:
    enabled: true
  
  alerting:
    enabled: false
  
  unified_alerting:
    enabled: true

# RBAC
rbac:
  create: true
  pspEnabled: false

serviceAccount:
  create: true

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472

# Enable plugins
plugins:
  - grafana-piechart-panel
  - grafana-worldmap-panel

# Sidecar for dashboard management
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    folder: /tmp/dashboards
    searchNamespace: ALL
  datasources:
    enabled: true
    label: grafana_datasource
    searchNamespace: ALL

# ServiceMonitor for Prometheus (disabled until Prometheus Operator is installed)
serviceMonitor:
  enabled: false
  labels:
    app: grafana
